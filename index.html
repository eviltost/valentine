<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💕 tost quiz 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      font-family: 'Georgia', serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      text-align: center;
      padding: 40px;
      background: rgba(255,255,255,0.9);
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 500px;
      position: relative;
      z-index: 10;
    }
    h1 { color: #e74c7c; font-size: 2.5rem; margin-bottom: 10px; }
    .heart-emoji { font-size: 3rem; margin-bottom: 20px; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    .question { font-size: 1.8rem; color: #c0392b; margin-bottom: 40px; font-style: italic; }
    .btn {
      padding: 15px 40px;
      font-size: 1.3rem;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      font-weight: bold;
    }
    .yes-btn {
      background: linear-gradient(45deg, #e74c7c, #ff6b9d);
      color: white;
      box-shadow: 0 8px 25px rgba(231,76,124,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .yes-btn:hover { transform: scale(1.1); box-shadow: 0 12px 35px rgba(231,76,124,0.5); }
    .no-btn {
      position: fixed;
      background: linear-gradient(45deg, #bdc3c7, #95a5a6);
      color: white;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      z-index: 100;
      transition: left 0.3s ease-out, top 0.3s ease-out;
    }
    .celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      animation: fadeIn 0.5s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    .celebration h2 { color: #e74c7c; font-size: 2.5rem; margin-bottom: 20px; }
    .celebration img { width: 280px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
    .celebration p { margin-top: 20px; font-size: 1.3rem; color: #c0392b; }
    .floating-hearts { position: fixed; width: 100%; height: 100%; pointer-events: none; top: 0; left: 0; overflow: hidden; z-index: 0; }
    .floating-heart { position: absolute; font-size: 2rem; animation: float 6s ease-in-out infinite; opacity: 0.6; }
    .floating-photo {
      position: absolute;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      object-fit: cover;
      animation: float 8s ease-in-out infinite;
      opacity: 0.85;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    @keyframes float {
      0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="floating-hearts" id="hearts"></div>
  <div class="container" id="card">
    <div class="heart-emoji">💕</div>
    <h1>henlo</h1>
    <p class="question">Will you be my Valentine?</p>
    <button class="btn yes-btn" id="yesBtn">YES 💖</button>
  </div>
  <button class="btn no-btn" id="noBtn">No</button>
  <div class="container celebration" id="celebration">
    <h2>KÎĮÎĨÍĪİÎİ!! 🎉💕</h2>
    <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute cat with heart">
    <p>mi luv 💖</p>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const card = document.getElementById('card');
    const celebration = document.getElementById('celebration');
    const heartsContainer = document.getElementById('hearts');
    const heartTypes = ['💕', '💖', '💗', '💓', '❤️', '💘'];

    // Initialize No button position
    noBtn.style.left = (window.innerWidth * 0.7) + 'px';
    noBtn.style.top = (window.innerHeight * 0.5) + 'px';

    // REPLACE THESE WITH YOUR PHOTO FILENAMES
    const photos = [
      'cat.png',
      'cat2.png',
      'cat3.png',
      'toast.png',
      'squid.png'
    ];

    // Create floating hearts
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = heartTypes[Math.floor(Math.random() * heartTypes.length)];
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDelay = Math.random() * 6 + 's';
      heart.style.animationDuration = (5 + Math.random() * 4) + 's';
      heartsContainer.appendChild(heart);
    }

    // Create floating photos (each photo appears twice, staggered)
    for (let i = 0; i < 8; i++) {
      const photo = document.createElement('img');
      photo.className = 'floating-photo';
      photo.src = photos[i % 4];
      photo.style.left = Math.random() * 90 + 5 + 'vw';
      photo.style.animationDelay = (i * 3 + Math.random() * 2) + 's';
      photo.style.animationDuration = (7 + Math.random() * 4) + 's';
      heartsContainer.appendChild(photo);
    }

    // Check if two rectangles overlap
    function rectsOverlap(r1, r2, padding = 20) {
      return !(r1.right + padding < r2.left || r1.left - padding > r2.right || 
               r1.bottom + padding < r2.top || r1.top - padding > r2.bottom);
    }

    // No button runs away smoothly
    noBtn.addEventListener('mouseover', () => {
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;
      const padding = 50;
      const yesRect = yesBtn.getBoundingClientRect();
      
      let newX, newY, attempts = 0;
      
      // Find a position that doesn't overlap with Yes button
      do {
        newX = padding + Math.random() * (window.innerWidth - btnWidth - padding * 2);
        newY = padding + Math.random() * (window.innerHeight - btnHeight - padding * 2);
        
        const newRect = { left: newX, right: newX + btnWidth, top: newY, bottom: newY + btnHeight };
        attempts++;
        
        if (!rectsOverlap(newRect, yesRect, 30) || attempts > 50) break;
      } while (true);
      
      noBtn.style.left = newX + 'px';
      noBtn.style.top = newY + 'px';
    });

    // Yes button celebration
    yesBtn.addEventListener('click', () => {
      card.style.display = 'none';
      noBtn.style.display = 'none';
      celebration.style.display = 'flex';
      
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const heart = document.createElement('span');
          heart.className = 'floating-heart';
          heart.textContent = heartTypes[Math.floor(Math.random() * heartTypes.length)];
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.fontSize = (1.5 + Math.random() * 2) + 'rem';
          heart.style.animationDuration = (3 + Math.random() * 3) + 's';
          heartsContainer.appendChild(heart);
        }, i * 100);
      }
    });
  </script>
</body>
</html>
